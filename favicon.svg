<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glowing Outer Border Gradient -->
    <linearGradient id="borderGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Central Nucleus Glow -->
    <radialGradient id="nucleusGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Electron Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Container: Rounded Squircle Card -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad512)" stroke="url(#borderGrad512)" stroke-width="16"/>

  <!-- Inner Subtle Grid Glow / Aura -->
  <circle cx="256" cy="256" r="210" fill="#3b82f6" opacity="0.04" />
  <circle cx="256" cy="256" r="150" fill="#10b981" opacity="0.05" />

  <!-- Atomic Orbital Rings (512px High Res) -->
  <g fill="none" stroke-width="12" opacity="0.95">
    <!-- Orbit 1: Metallic / Blue Ellipse -->
    <ellipse cx="256" cy="256" rx="190" ry="70" stroke="#38bdf8" transform="rotate(-30 256 256)"/>
    
    <!-- Orbit 2: Covalent / Green Ellipse -->
    <ellipse cx="256" cy="256" rx="190" ry="70" stroke="#34d399" transform="rotate(30 256 256)"/>
    
    <!-- Orbit 3: Ionic / Purple Ellipse -->
    <ellipse cx="256" cy="256" rx="190" ry="70" stroke="#c084fc" transform="rotate(90 256 256)"/>
  </g>

  <!-- Chemical Bond Energy Arc -->
  <path d="M 110 256 C 180 130, 332 130, 402 256" fill="none" stroke="#f59e0b" stroke-width="10" stroke-dasharray="14,12" opacity="0.85"/>

  <!-- Electrons / Valence Nodes with High Glow -->
  <!-- Blue Orbit Electron -->
  <g filter="url(#glowFilter)">
    <circle cx="104" cy="168" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="6"/>
    <circle cx="98" cy="162" r="7" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Green Orbit Electron -->
  <g filter="url(#glowFilter)">
    <circle cx="408" cy="168" r="22" fill="#34d399" stroke="#ffffff" stroke-width="6"/>
    <circle cx="402" cy="162" r="7" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Purple Orbit Electron -->
  <g filter="url(#glowFilter)">
    <circle cx="256" cy="446" r="22" fill="#c084fc" stroke="#ffffff" stroke-width="6"/>
    <circle cx="250" cy="440" r="7" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Gold Top Electron Node -->
  <g filter="url(#glowFilter)">
    <circle cx="256" cy="66" r="24" fill="#fbbf24" stroke="#ffffff" stroke-width="6"/>
    <circle cx="250" cy="60" r="8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Atomic Nucleus Cluster -->
  <circle cx="256" cy="256" r="75" fill="url(#nucleusGlow512)"/>
  
  <!-- Proton & Neutron Sub-particles -->
  <circle cx="240" cy="240" r="28" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
  <circle cx="272" cy="246" r="26" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
  <circle cx="250" cy="275" r="26" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="276" cy="268" r="20" fill="#ffffff" opacity="0.95"/>
</svg>